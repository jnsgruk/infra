name: "Deploy"
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Check formatting of Cloudflare configuration
        run: terraform fmt -check dns-jnsgr-uk.tf dns-jnsgr-uk-migration.tf provider.tf variables.tf

      - name: Initialise without production state
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    env:
      ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
      TF_VAR_do_token: ${{ secrets.TF_VAR_do_token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Initialise terraform
        run: terraform init

      - name: Deploy
        run: terraform apply -auto-approve
